name: Submeter Agente ao Kaggle

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar CLI do Kaggle
        run: pip install kaggle

      - name: Compactar código do agente (pasta src)
        run: |
          tar --exclude='*__pycache__*' --exclude='.kaggle' -C src -czf submission.tar.gz .

      - name: Enviar submissão para a competição
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle competitions submit kaggriculture -f submission.tar.gz -m "Submissao automatica commit ${{ github.sha }}"

